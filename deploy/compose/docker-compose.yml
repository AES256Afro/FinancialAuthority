# Standalone deployment. On BigBox, install FinancialAuthority from BoxPilot's app catalog instead.
#
#   cp .env.example .env   (fill in the three secrets)
#   docker compose up -d --build
#
# Expects an Ollama server on the host at port 11434 for the built-in chat (optional).
services:
  financialauthority:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: ghcr.io/aes256afro/financialauthority:${FA_IMAGE_TAG:-edge}
    container_name: financialauthority
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FA_PORT:-8430}:8000"
    volumes:
      - ./data:/data
      - ./imports:/imports
      # A folder on another disk for sealed copies; point it at a USB drive or a synced folder (Settings > Backups).
      - ${FA_OFFBOX_HOST_DIR:-./offbox}:/offbox
    env_file:
      - path: .env
        required: false
    environment:
      FA_INSTALL: compose
      FA_OFFBOX_DIR: /offbox
      FA_BRIDGE_CONTAINER: financialauthority-bridge
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
  bridge:
    # Proton Mail Bridge, optional. The app's Connectors page walks through the one sign-in, step by step.
    # Sign in once:  docker compose run --rm bridge init
    # (login, your address, password and code; info prints the IMAP username and password; exit)
    # then:  docker compose --profile bridge up -d bridge
    # In the app: Connectors, Proton, host bridge, port 143, the username and password info printed.
    build:
      context: ../bridge
    image: financialauthority-bridge:local
    container_name: financialauthority-bridge
    restart: unless-stopped
    profiles: ["bridge"]
    volumes:
      - ./bridge:/root
