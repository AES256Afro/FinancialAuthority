# Draft BoxPilot catalog manifest (schemaVersion 2). Pinned to a release once one exists (M7.2),
# then sent to BoxPilot as a pull request. Host port 8430 was free in the catalog on 2026-10-14.
schemaVersion: 2
id: financialauthority
name: FinancialAuthority
category: Finance
icon: "🏦"
description: "Reads your transactions, paychecks, bills, debts (including Affirm, Klarna and Afterpay plans), subscriptions and bill emails, and lets any model plan each paycheck, check a purchase, and suggest which billing dates to move. Never moves money. Uses this server's Ollama or any OpenAI-compatible server, or Claude."
website: https://github.com/AES256Afro/FinancialAuthority
risk: low
image:
  reference: ghcr.io/aes256afro/financialauthority:0.1.0
  version: "0.1.0"
ports:
  - id: web
    label: Web UI and MCP
    container: 8000
    host: 8430
    exposure: lan
volumes:
  - id: data
    label: Ledger, bills, rules, connector settings and the audit log
    container: /data
    path: data
    backup: true
  - id: imports
    label: Imports
    container: /imports
    hostPath: /srv/financialauthority-imports
    configurable: true
    backup: false
    description: Drop folder for bank and Rocket Money CSV exports. Share it over SMB from Storage and a file copied in is imported; what is imported is kept in the data folder, which is backed up, so this folder isn't.
env:
  - name: FA_USERNAME
    label: Owner username
    default: owner
  - name: FA_PASSWORD
    label: Owner password
    type: password
    generate: true
    description: Generated by BoxPilot and required to sign in.
  - name: FA_SESSION_SECRET
    label: Session signing secret
    type: password
    generate: true
    description: Generated by BoxPilot. Changing it signs every browser out.
  - name: FA_DATA_KEY
    label: Data encryption key
    type: password
    generate: true
    description: Generated by BoxPilot. Encrypts mailbox passwords, aggregator tokens and account numbers inside the database. Losing it loses those; the ledger itself stays readable.
  - name: FA_OLLAMA_URL
    label: Where Ollama is
    description: The Ollama API. The default reaches this server's Ollama app while its reach is LAN. If Ollama is Tailscale-only, enter its tailnet address with port 11434.
    default: http://host.docker.internal:11434
  - name: FA_ANTHROPIC_API_KEY
    label: Anthropic API key (optional)
    type: password
    description: Lets the built-in chat use Claude. Mail bodies and account numbers are never sent; the redaction level for cloud models is set in Settings.
  - name: FA_OPENAI_BASE_URL
    label: OpenAI-compatible server (optional)
    description: Any server that speaks the OpenAI API, for example llama.cpp, vLLM or LocalAI on this network, or api.openai.com.
  - name: FA_OPENAI_API_KEY
    label: Key for that server (optional)
    type: password
  - name: FA_DATA_DIR
    default: /data
    fixed: true
  - name: FA_IMPORT_DIR
    default: /imports
    fixed: true
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
    description: Due dates and paydays are worked out in this zone.
extraHosts:
  - host.docker.internal:host-gateway
connections:
  - app: ollama
    role: model server
    where: install Ollama first and pull a chat model; FinancialAuthority reaches it at this server's port 11434
    note: Ollama is its own compose project, so FinancialAuthority reaches it through host.docker.internal rather than a container name. Without it the app still plans; only the chat needs a model.
signIn:
  path: /
  port: web
  usernameEnv: FA_USERNAME
  passwordEnv: FA_PASSWORD
  note: BoxPilot generates the owner password. Mailbox and aggregator credentials are entered inside the app and encrypted with the data key. The MCP endpoint for Claude Desktop, Claude Code and other clients is /mcp on the same port, with an API key made on the app's API keys page.
health:
  kind: healthcheck
  timeoutSeconds: 300
notes: "It never moves money or sends mail: it reads, plans and writes drafts. Connect a mailbox (Proton Mail through the Proton Mail Bridge app, or any IMAP mailbox with an app password) and drop a Rocket Money or bank CSV export into Imports to begin. Every recommendation shows the rows it was computed from and says it is not financial advice."
