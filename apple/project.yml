# XcodeGen: `brew install xcodegen`, then `xcodegen` in this folder makes FinancialAuthority.xcodeproj.
# Before building, set BUNDLE_PREFIX to your own reverse domain and DEVELOPMENT_TEAM to your team ID (Xcode ›
# Settings › Accounts). Nothing personal is committed here.
name: FinancialAuthority
options:
  bundleIdPrefix: com.example.financialauthority
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_PREFIX: com.example.financialauthority
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  FinancialAuthority:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Authority
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: financialauthority.oauth
            CFBundleURLSchemes: [financialauthority]
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        FASharedKeychainGroup: $(BUNDLE_PREFIX).shared
        FAAppGroup: group.$(BUNDLE_PREFIX)
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_PREFIX).shared]
    dependencies:
      - target: FAWidgets
      - target: FAWatch
  FAWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Authority
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        FASharedKeychainGroup: $(BUNDLE_PREFIX).shared
        FAAppGroup: group.$(BUNDLE_PREFIX)
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_PREFIX).shared]
  FAWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Authority
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_PREFIX)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        FASharedKeychainGroup: $(BUNDLE_PREFIX).watch.shared
        FAAppGroup: group.$(BUNDLE_PREFIX).watch
    entitlements:
      path: Watch/Watch.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).watch]
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_PREFIX).watch.shared]
    dependencies:
      - target: FAWatchWidgets
  FAWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp.widgets
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Authority
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        FASharedKeychainGroup: $(BUNDLE_PREFIX).watch.shared
        FAAppGroup: group.$(BUNDLE_PREFIX).watch
    entitlements:
      path: WatchWidgets/WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).watch]
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_PREFIX).watch.shared]
